<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#EEF1F5"/>
      <stop offset="0.6" stop-color="#D5DCE6"/>
      <stop offset="1" stop-color="#AEB9C9"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16325F"/>
      <stop offset="1" stop-color="#071A36"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3F63"/>
      <stop offset="1" stop-color="#0E2242"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <!-- neck -->
  <path d="M345 470 h110 v90 c0 30 -110 30 -110 0 z" fill="#132B52"/>
  <!-- head -->
  <ellipse cx="400" cy="340" rx="132" ry="162" fill="url(#head)"/>
  <!-- shoulders / suit -->
  <path d="M90 1000 C100 760 190 640 330 600 L400 700 L470 600 C610 640 700 760 710 1000 Z" fill="url(#suit)"/>
  <!-- shirt -->
  <path d="M330 600 L400 700 L470 600 L452 590 L400 650 L348 590 Z" fill="#F4F6F8"/>
  <!-- tie -->
  <path d="M388 660 L412 660 L420 700 L408 860 L392 860 L380 700 Z" fill="#D9A21B"/>
  <!-- lapels -->
  <path d="M330 600 L400 700 L360 820 L300 640 Z" fill="#0B2348"/>
  <path d="M470 600 L400 700 L440 820 L500 640 Z" fill="#0B2348"/>
  <!-- soft rim light -->
  <ellipse cx="400" cy="340" rx="132" ry="162" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="6"/>
</svg>
